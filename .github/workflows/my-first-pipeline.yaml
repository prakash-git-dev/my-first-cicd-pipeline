name: My First Automated CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Step 1 - Check out repository code files
      uses: actions/checkout@v4

    - name: Step 2 - Install Python runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # <-- Corrected from python-style

    - name: Step 3 - Install testing dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Step 4 - Execute automated pytest validations
      run: |
        pytest test_app.py
