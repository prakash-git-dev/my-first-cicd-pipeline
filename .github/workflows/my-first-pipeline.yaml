name: My First Automated CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # STAGE 1: Run the Quality Validation Tests
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Step 1 - Check out repository code files
      uses: actions/checkout@v4

    - name: Step 2 - Install Python runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Step 3 - Install testing dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Step 4 - Execute automated pytest validations
      run: |
        pytest test_app.py

  # STAGE 2: Compile the Docker Container (Runs ONLY if Stage 1 passes!)
  build-docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test # <-- This creates the strict chronological dependency!
    steps:
    - name: Check out repository code files
      uses: actions/checkout@v4

    - name: Set up Docker Buildx Engine
      uses: docker/setup-buildx-action@v3

    - name: Compile and Verify Container Build
      run: |
        docker build -t my-automated-flask-app:${{ github.sha }} .
        echo "Success! Docker image built cleanly using code commit version token ${{ github.sha }}"
