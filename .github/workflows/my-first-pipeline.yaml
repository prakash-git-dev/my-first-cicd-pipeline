name: My First Automated CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # STAGE 1: Run Quality Validation Tests
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Step 1 - Check out repository code files
      uses: actions/checkout@v4

    - name: Step 2 - Install Python runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Step 3 - Install testing dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Step 4 - Execute automated pytest validations
      run: |
        pytest test_app.py

  # STAGE 2: Build and Securely Push to Docker Hub
  build-docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Check out repository code files
      uses: actions/checkout@v4

    - name: Log in to Docker Hub Securely
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Set up Docker Buildx Engine
      uses: docker/setup-buildx-action@v3

    - name: Compile and Push Container to Registry
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        # REPLACE 'your-dockerhub-username' with your actual username string below:
        tags: |
          prakashgayathri/my-automated-flask-app:latest
          prakashgayathri/my-automated-flask-app:${{ github.sha }}
