apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-deployment
  labels:
    app: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-container
        image: prakashgayathri/my-automated-flask-app:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        envFrom:
        - secretRef:
            name: flask-app-secrets
        - configMapRef:
            name: flask-app-config
        readinessProbe:
          exec:
            command: 
            - sh
            - -c
            - cat /proc/1/cmdline | grep -q python
          initialDelaySeconds: 10
          periodSeconds: 5
